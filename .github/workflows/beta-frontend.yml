name: "[BETA] Deploy Frontend to Azure Static Web Apps"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers ONLY on the beta branch.
# Every push to beta deploys the React frontend to Azure Static Web Apps.
# Uses the same Azure token as main — Azure environments are separated by
# environment variable overrides (REACT_APP_BACKEND_URL) if needed.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - beta
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - beta

jobs:
  build_and_deploy_job:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy (beta → Azure SWA)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_MOSS_04C4BE41E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""
          output_location: "build"
        env:
          # Point to the backend App Service URL
          REACT_APP_BACKEND_URL: "https://storyme-backend-d4bxg3afcdbreebt.centralindia-01.azurewebsites.net"

          # Suppress react-scripts ESLint / Node version conflicts in CI
          DISABLE_ESLINT_PLUGIN: "true"
          SKIP_PREFLIGHT_CHECK: "true"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request (beta)

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_MOSS_04C4BE41E }}
          action: "close"
