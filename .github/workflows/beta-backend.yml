name: "[BETA] Deploy Backend to Azure App Service"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers on every push to beta.
# Deploys FastAPI backend to storyme-backend Azure App Service.
#
# WORKER CLASS — HOW THIS IS SOLVED
# -----------------------------------
# Oryx auto-detects this app as "Flask" and generates:
#   gunicorn --timeout 600 --access-logfile '-' server:app
#
# No -k flag → gunicorn defaults to sync (WSGI) worker → FastAPI crashes:
#   TypeError: FastAPI.__call__() missing 1 required positional argument: 'send'
#
# THE FIX: backend/gunicorn.conf.py
#   Gunicorn reads gunicorn.conf.py from its CWD at startup automatically,
#   with no command-line flags required. Oryx extracts the tarball to
#   /tmp/<hash>/ and runs gunicorn from that directory. Our gunicorn.conf.py
#   is inside the tarball, so it lands at /tmp/<hash>/gunicorn.conf.py and
#   is automatically picked up. It sets:
#     worker_class = "uvicorn.workers.UvicornWorker"
#
# WHAT DIDN'T WORK AND WHY (documented to avoid regression):
#   Procfile:         Oryx reads /home/site/wwwroot/Procfile. Our Procfile
#                     is inside output.tar.zst, extracted to /tmp/<hash>/.
#                     Oryx never finds it → always falls back to auto-detect.
#   Kudu /api/settings: This endpoint does NOT exist on newer Azure stamps
#                     (centralindia-01). Returns 404 "No route registered".
#                     The step was blocking deployment entirely — gunicorn.conf.py
#                     was never deployed because the Kudu step failed first
#                     and skipped the deploy step.
#   startup-command:  Not supported with publish-profile auth in webapps-deploy@v2.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - beta

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy (beta → Azure App Service)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate dependencies
        run: |
          # Validate requirements.txt installs cleanly.
          # Do NOT create a venv inside backend/ — it would be packaged with
          # absolute symlinks to the CI runner's Python which don't exist on
          # Azure. Oryx builds the venv (antenv/) at deploy time.
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify gunicorn.conf.py is present in package
        run: |
          # gunicorn.conf.py is the mechanism that forces UvicornWorker.
          # Gunicorn reads it automatically from its CWD at startup.
          # If this file is missing, every request will crash with:
          #   TypeError: FastAPI.__call__() missing 1 required positional argument: 'send'
          if [ ! -f backend/gunicorn.conf.py ]; then
            echo "ERROR: backend/gunicorn.conf.py is missing!"
            exit 1
          fi
          echo "✅ gunicorn.conf.py present"
          grep "worker_class" backend/gunicorn.conf.py
          echo "✅ worker_class confirmed in config"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: storyme-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Only package the backend/ directory.
          # This means gunicorn.conf.py, startup.sh, Procfile, server.py,
          # requirements.txt, templates/, etc. are all included.
          package: backend
