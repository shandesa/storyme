name: "[BETA] Deploy Backend to Azure App Service"

# ─────────────────────────────────────────────────────────────────────────────
# Triggers ONLY on the beta branch.
# Every push to beta builds the FastAPI backend and deploys it to Azure.
#
# Architecture notes (same as main pipeline):
#   - No venv is created in CI. Azure Oryx (SCM_DO_BUILD_DURING_DEPLOYMENT)
#     builds antenv/ at deploy time with correct Azure-relative paths.
#   - Startup command is declared in backend/Procfile (read by Azure automatically).
#   - Only the backend/ directory is packaged and deployed.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - beta

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy (beta → Azure App Service)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ── Python setup & dependency validation ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate dependencies
        run: |
          # Validate that requirements.txt installs cleanly in CI.
          #
          # IMPORTANT: We intentionally do NOT create a venv inside backend/.
          # azure/webapps-deploy packages the entire backend/ directory.
          # A venv created here would contain absolute symlinks pointing to the
          # GitHub runner's Python (/opt/hostedtoolcache/...) which do NOT exist
          # on Azure App Service — causing startup.sh to fail and uvicorn to
          # never start (manifests as 502/503 errors with broken CORS headers).
          #
          # Azure Oryx (SCM_DO_BUILD_DURING_DEPLOYMENT=true, the default) creates
          # antenv/ at deploy time with correct Azure-relative paths.
          # startup.sh then activates that venv.
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: storyme-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Only package the backend/ directory — no frontend assets, no tests
          package: backend
          # NOTE: startup-command is NOT valid when using publish-profile auth.
          # Startup is declared via backend/Procfile, which Azure reads automatically.
